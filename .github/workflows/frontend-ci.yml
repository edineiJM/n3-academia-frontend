name: CI Front-end

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Instalar dependências
      run: npm install

    - name: Executar Build do Front-end
      run: npm run build